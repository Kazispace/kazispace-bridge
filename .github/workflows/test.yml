name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Syntax check
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP tests
        run: find tests -name '*_test.php' -print0 | xargs -0 -n1 php
